# Speech-to-text settings shared by the agent (agent.py) and the eval (evals/run.py),
# so the configuration we measure is the configuration we deploy.
#
# Fairness rules: each provider runs its published voice-agent defaults. The only shared
# hint is the language list. No keyterm boosting and no conversation context for anyone,
# and nothing here was tuned on the eval clips.

languages: [en, es]

assemblyai:
  model: assemblyai-stt-3-7-realtime-agent  # the LiveKit plugin's default model; it sends this as `speech_model`
  min_turn_silence: 100       # AssemblyAI API default
  max_turn_silence: 1000      # AssemblyAI API default (the LiveKit plugin would otherwise use 100 ms)
  previous_context_n_turns: 0 # no carryover of prior turns as context
  # Automatic agent_context is turned off in agent.py via
  # AgentSession(stt_context_options={"forward_chat_context": False}).
  # The plugin URL-encodes language_codes as a JSON list (e.g. ["en","es"]) and sets
  # language_detection=true for this model. The eval mirrors both.
  chunk_ms: 50

deepgram:
  model: flux-general-multi   # Deepgram's voice-agent model; multilingual (en, es, ...)
  # Language hints are sent as repeated `language_hint` params (LiveKit: STTv2(language_hint=[...])).
  chunk_ms: 80                # Deepgram recommends 80 ms chunks for Flux

tts:
  model: assemblyai-tts-1
  voice: aai-antonioluis      # Spanish voice; the bilingual spike in Task 2 may change this
  language: es

sample_rate: 16000
trailing_silence_s: 2.0
