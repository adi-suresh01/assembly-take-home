[project]
name = "assembly-take-home"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jiwer>=4.0.0",
    "livekit-agents[anthropic,assemblyai,deepgram,silero]>=1.9.0",
    "numpy>=2.5.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
